<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Basecamp MCP Server Architecture</title>
  <desc id="desc">AI agent connected to a policy-aware MCP server and the Basecamp API, with preview-bound confirmation tokens for sensitive card workflow actions.</desc>
  <rect width="1600" height="900" fill="#0d1117"/>
  <style>
    .title{font:700 54px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f0f6fc}
    .h{font:700 32px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f0f6fc}
    .t{font:500 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:#c9d1d9}
    .s{font:500 21px system-ui,-apple-system,Segoe UI,sans-serif;fill:#8b949e}
    .box{fill:#161b22;stroke:#58a6ff;stroke-width:3;rx:22}
    .sub{fill:#0d1117;stroke:#30363d;stroke-width:2;rx:14}
    .arrow{stroke:#58a6ff;stroke-width:5;fill:none;marker-end:url(#arrow)}
    .line{stroke:#58a6ff;stroke-width:3;fill:none}
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <text x="800" y="82" text-anchor="middle" class="title">Basecamp MCP Server Architecture</text>
  <line x1="470" y1="112" x2="1130" y2="112" class="line"/>

  <rect x="80" y="215" width="350" height="220" class="box"/>
  <text x="255" y="315" text-anchor="middle" class="h">AI Agent</text>
  <text x="255" y="360" text-anchor="middle" class="t">MCP-compatible client</text>

  <path d="M430 325 H540" class="arrow"/>

  <rect x="540" y="165" width="520" height="320" class="box"/>
  <text x="800" y="225" text-anchor="middle" class="h">MCP Server</text>
  <rect x="610" y="255" width="380" height="54" class="sub"/>
  <text x="800" y="291" text-anchor="middle" class="t">Authentication</text>
  <rect x="610" y="324" width="380" height="54" class="sub"/>
  <text x="800" y="360" text-anchor="middle" class="t">Tool Routing + Guardrails</text>
  <rect x="610" y="393" width="380" height="54" class="sub"/>
  <text x="800" y="429" text-anchor="middle" class="t">Preview-bound Confirmations</text>

  <path d="M1060 325 H1170" class="arrow"/>

  <rect x="1170" y="215" width="350" height="220" class="box"/>
  <text x="1345" y="315" text-anchor="middle" class="h">Basecamp API</text>
  <text x="1345" y="360" text-anchor="middle" class="t">Projects • To-dos • Cards</text>

  <path d="M800 485 V555" class="line"/>
  <path d="M190 555 H1410" class="line"/>
  <text x="800" y="535" text-anchor="middle" class="h">Available MCP Tools</text>

  <rect x="75" y="600" width="260" height="105" class="sub"/>
  <text x="205" y="650" text-anchor="middle" class="t">Search Cards</text>
  <text x="205" y="682" text-anchor="middle" class="s">read-only</text>

  <rect x="370" y="600" width="260" height="105" class="sub"/>
  <text x="500" y="650" text-anchor="middle" class="t">Read Context</text>
  <text x="500" y="682" text-anchor="middle" class="s">read-only</text>

  <rect x="665" y="600" width="270" height="105" class="sub"/>
  <text x="800" y="650" text-anchor="middle" class="t">Preview Changes</text>
  <text x="800" y="682" text-anchor="middle" class="s">issues confirmation_id</text>

  <rect x="970" y="600" width="260" height="105" class="sub"/>
  <text x="1100" y="650" text-anchor="middle" class="t">Update Tasks</text>
  <text x="1100" y="682" text-anchor="middle" class="s">token required</text>

  <rect x="1265" y="600" width="260" height="105" class="sub"/>
  <text x="1395" y="650" text-anchor="middle" class="t">Reports</text>
  <text x="1395" y="682" text-anchor="middle" class="s">token required</text>

  <rect x="220" y="765" width="1160" height="90" class="box"/>
  <text x="800" y="808" text-anchor="middle" class="t">Sensitive card writes must match a short-lived, single-use preview token.</text>
  <text x="800" y="838" text-anchor="middle" class="s">The MCP host should forward the token only after explicit human approval.</text>
</svg>
