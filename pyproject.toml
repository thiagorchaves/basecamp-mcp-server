[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basecamp-mcp-server"
version = "0.2.0"
description = "An MCP server for Basecamp projects, to-dos, messages, and Card Tables."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Thiago Romualdo Chaves" },
]
keywords = ["basecamp", "mcp", "model-context-protocol", "automation", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/thiagorchaves/basecamp-mcp-server"
Repository = "https://github.com/thiagorchaves/basecamp-mcp-server"
Issues = "https://github.com/thiagorchaves/basecamp-mcp-server/issues"
Changelog = "https://github.com/thiagorchaves/basecamp-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
basecamp-mcp = "basecamp_mcp.server:main"
basecamp-oauth = "basecamp_mcp.oauth:main"
basecamp-test = "basecamp_mcp.test_connection:main"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["basecamp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=basecamp_mcp --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
